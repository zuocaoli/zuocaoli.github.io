<div class="expressive-code"><link rel="stylesheet" href="/_astro/ec.z7juk.css"><script type="module" src="/_astro/ec.0vx5m.js"></script><figure class="frame is-terminal"><figcaption class="header"><span class="title"></span><span class="sr-only">Terminal window</span></figcaption><pre data-language="bash"><code><div class="ec-line"><div class="code"><span style="--0:#616972;--1:#99A0A6"># 显示内存使用量最大的前10个进程</span></div></div><div class="ec-line"><div class="code"><span style="--0:#6F42C1;--1:#B392F0">ps</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#005CC5;--1:#79B8FF">-eo</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#032F62;--1:#9ECBFF">pid,comm,%mem</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#005CC5;--1:#79B8FF">--sort</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#005CC5;--1:#79B8FF">-%mem</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#BF3441;--1:#F97583">|</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#6F42C1;--1:#B392F0">head</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#005CC5;--1:#79B8FF">-n</span><span style="--0:#24292E;--1:#E1E4E8"> </span><span style="--0:#005CC5;--1:#79B8FF">10</span></div></div></code></pre><div class="copy"><div aria-live="polite"></div><button title="Copy to clipboard" data-copied="Copied!" data-code="ps -eo pid,comm,%mem --sort -%mem | head -n 10"><div></div></button></div></figure></div>
<p>参数解释：</p>
<ul>
<li><code>-e</code>：显示所有进程。</li>
<li><code>-o</code>：自定义输出格式，指定需要显示的字段：  pid(进程ID),comm(进程名),%mem(进程使用的内存百分比)。</li>
<li><code>--sort -%mem</code>：按照内存使用百分比降序排序。</li>
<li><code>head -n 10</code>：显示前10行。</li>
